{% extends "base.html" %}
{% block title %}URL Stats{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="bi bi-bar-chart"></i> URL Statistics</h3>

<div class="row mb-4" id="statsHeader">
    <div class="col-12">
        <div class="card border-secondary">
            <div class="card-body">
                <h5 id="statsShortUrl" class="mb-1"></h5>
                <p id="statsOriginalUrl" class="text-secondary mb-0"></p>
                <div class="mt-3">
                    <span class="badge bg-info fs-6" id="statsClickCount">0</span> total clicks
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card border-secondary">
    <div class="card-header"><i class="bi bi-clock-history"></i> Recent Clicks</div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark table-striped mb-0">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Device</th>
                        <th>Referrer</th>
                        <th>User Agent</th>
                    </tr>
                </thead>
                <tbody id="clicksTableBody">
                    <tr><td colspan="4" class="text-center text-secondary">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="mt-4">
    <a href="/dashboard" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
</div>
{% endblock %}

{% block scripts %}
<script>
const shortCode = window.location.pathname.split('/').pop();

async function loadStats() {
    try {
        const data = await apiCall('GET', '/stats/' + shortCode);
        document.getElementById('statsShortUrl').innerHTML = '<i class="bi bi-link-45deg"></i> /' + data.short_code;
        document.getElementById('statsOriginalUrl').textContent = data.original_url;
        document.getElementById('statsClickCount').textContent = data.total_clicks;

        const tbody = document.getElementById('clicksTableBody');
        const clicks = data.recent_clicks || [];

        if (clicks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-secondary">No clicks yet.</td></tr>';
            return;
        }

        tbody.innerHTML = clicks.map(c => `
            <tr>
                <td>${new Date(c.timestamp).toLocaleString()}</td>
                <td><span class="badge bg-secondary">${c.device_type || 'unknown'}</span></td>
                <td>${c.referrer || '—'}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${c.user_agent || ''}">${c.user_agent || '—'}</td>
            </tr>
        `).join('');
    } catch (e) {
        document.getElementById('clicksTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Failed to load stats</td></tr>';
    }
}

loadStats();
</script>
{% endblock %}
