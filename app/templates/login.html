{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center" style="padding-top:40px;">
    <div class="col-md-5">
        <div class="card border-secondary">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="usernameInput" placeholder="yourusername">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Enter password">
                </div>
                <button class="btn btn-primary w-100" id="loginBtn">Login</button>
                <p class="text-center mt-3 mb-0">
                    No account? <a href="/register">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginBtn').addEventListener('click', async function() {
    const btn = this;
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    if (!username || !password) { flash('All fields required', 'warning'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Logging in...';

    try {
        const data = await apiCall('POST', '/auth/login', { username, password });
        localStorage.setItem('token', data.access_token);
        window.location.href = '/dashboard';
    } catch (e) {
        flash(e.message, 'danger');
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});
</script>
{% endblock %}
